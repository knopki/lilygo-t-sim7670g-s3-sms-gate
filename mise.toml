[settings]
all_compile = false

[tools]
arduino-cli = "1.5.1"
clang-format = "22.1.8"
"pipx:cppcheck" = "1.5.1"
biome = "2.5.10"

[tasks."assets"]
description = "Generate gzipped PROGMEM web assets from www/"
run = "python3 tools/gen_assets.py"

[tasks."compile"]
description = "Generate web assets and compile the firmware"
depends = ["assets"]
run = "arduino-cli compile sms_gate"

[tasks."fmt"]
description = "Format Arduino C++ source and headers, JS, HTML"
run = "clang-format -i $(find {sms_gate,tests} -name '*.ino' -o -name '*.h' -o -name '*.cpp') && biome format --write www/"

[tasks."fmt:check"]
description = "Check Arduino C++ formatting without modifying"
run = "clang-format --dry-run --Werror $(find {sms_gate,tests} -name '*.ino' -o -name '*.h' -o -name '*.cpp') && biome format www/"

[tasks."lint"]
description = "Run Cppcheck on Arduino C++ source, JS, HTML"
run = "cppcheck --language=c++ --std=c++20 --check-level=exhaustive --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unknownMacro:sms_gate/web_assets.h --suppress=constParameterReference --suppress=unusedStructMember --suppress=unusedFunction --suppress=unusedPrivateFunction --suppress=constVariable --suppress=constVariablePointer --suppress=cstyleCast --suppress=redundantCondition --suppress=knownConditionTrueFalse --suppress=duplicateAssignExpression --suppress=useStlAlgorithm --suppress=constParameterCallback --suppress=constParameterPointer:sms_gate/time_sync.cpp $(find sms_gate -name '*.ino' -o -name '*.h' -o -name '*.cpp') && biome check www/"

[tasks.test]
description = "Run all host tests"
run = """
set -e
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/config_record_test.cpp -o /tmp/config_record_test && /tmp/config_record_test
c++ -std=c++17 -Wall -Wextra -Werror -I tests/host_stub -I sms_gate tests/config_store_migration_test.cpp sms_gate/config_store_gps.cpp sms_gate/config_store_modem.cpp sms_gate/config_store_zte.cpp -o /tmp/config_store_migration_test && /tmp/config_store_migration_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/ntp_validate_test.cpp -o /tmp/ntp_validate_test && /tmp/ntp_validate_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/millis_deadline_test.cpp -o /tmp/millis_deadline_test && /tmp/millis_deadline_test
c++ -std=c++17 -Wall -Wextra -Werror -I tests/host_stub -I sms_gate tests/modem_lock_test.cpp -o /tmp/modem_lock_test && /tmp/modem_lock_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/smtp_client_test.cpp sms_gate/smtp_client.cpp -o /tmp/smtp_client_test && /tmp/smtp_client_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/zte_client_test.cpp sms_gate/zte_client.cpp sms_gate/zte_json.cpp sms_gate/zte_form_codec.cpp -o /tmp/zte_client_test && /tmp/zte_client_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/modem_client_test.cpp sms_gate/modem_client.cpp -o /tmp/modem_client_test && /tmp/modem_client_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/gps_client_test.cpp sms_gate/gps_client.cpp -o /tmp/gps_client_test && /tmp/gps_client_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate tests/zte_form_codec_test.cpp sms_gate/zte_form_codec.cpp -o /tmp/zte_form_codec_test && /tmp/zte_form_codec_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate -I tests/host_stub tests/sms_validate_test.cpp -o /tmp/sms_validate_test && /tmp/sms_validate_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate -I tests/host_stub tests/email_builder_test.cpp sms_gate/email_builder.cpp -o /tmp/email_builder_test && /tmp/email_builder_test
c++ -std=c++17 -Wall -Wextra -Werror -I sms_gate -I tests/host_stub tests/web_api_test.cpp -o /tmp/web_api_test && /tmp/web_api_test
c++ -std=c++17 -Wall -Wextra -Werror -pthread -I sms_gate -I tests/host_stub tests/time_sync_test.cpp sms_gate/time_sync.cpp sms_gate/gps_client.cpp sms_gate/modem_client.cpp -o /tmp/time_sync_test && /tmp/time_sync_test
"""
