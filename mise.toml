[settings]
all_compile = false

[tools]
arduino-cli = "1.5.1"
clang-format = "22.1.8"
"pipx:cppcheck" = "1.5.1"
biome = "2.5.10"

[tasks."assets"]
description = "Generate gzipped PROGMEM web assets from www/"
run = "python3 tools/gen_assets.py"

[tasks."compile"]
description = "Generate web assets and compile the firmware"
depends = ["assets"]
run = "arduino-cli compile sms_gate"

[tasks."fmt"]
description = "Format Arduino C++ source and headers, JS, HTML"
run = "clang-format -i sms_gate/*.{cpp,h} sms_gate/codec/*.h && biome format --write www/"

[tasks."fmt:check"]
description = "Check Arduino C++ formatting without modifying"
run = "clang-format --dry-run --Werror sms_gate/*.{cpp,h} sms_gate/codec/*.h && biome format www/"

[tasks."lint"]
description = "Run Cppcheck on Arduino C++ source, JS, HTML"
run = "cppcheck --language=c++ --std=c++20 --check-level=exhaustive --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unknownMacro:sms_gate/web_assets.h --suppress=constParameterReference --suppress=unusedStructMember sms_gate/*.{cpp,h} sms_gate/codec/*.h && biome check www/"

[tasks.test]
description = "Run all host tests (config, smtp, zte, modem, zte_form, sms_validate, email_builder, web_api)"
run = """
set -e
c++ -std=c++17 -Wall -Wextra -Werror tests/config_record_test.cpp -o /tmp/config_record_test && /tmp/config_record_test
c++ -std=c++17 -Wall -Wextra -Werror tests/smtp_client_test.cpp sms_gate/smtp_client.cpp -o /tmp/smtp_client_test && /tmp/smtp_client_test
c++ -std=c++17 -Wall -Wextra -Werror tests/zte_client_test.cpp sms_gate/zte_client.cpp sms_gate/zte_json.cpp sms_gate/zte_form_codec.cpp -o /tmp/zte_client_test && /tmp/zte_client_test
c++ -std=c++17 -Wall -Wextra -Werror tests/modem_client_test.cpp sms_gate/modem_client.cpp -o /tmp/modem_client_test && /tmp/modem_client_test
c++ -std=c++17 -Wall -Wextra -Werror tests/zte_form_codec_test.cpp sms_gate/zte_form_codec.cpp -o /tmp/zte_form_codec_test && /tmp/zte_form_codec_test
c++ -std=c++17 -Wall -Wextra -Werror -I tests/host_stub tests/sms_validate_test.cpp -o /tmp/sms_validate_test && /tmp/sms_validate_test
c++ -std=c++17 -Wall -Wextra -Werror -I tests/host_stub tests/email_builder_test.cpp sms_gate/email_builder.cpp -o /tmp/email_builder_test && /tmp/email_builder_test
c++ -std=c++17 -Wall -Wextra -Werror -I tests/host_stub tests/web_api_test.cpp -o /tmp/web_api_test && /tmp/web_api_test
"""
