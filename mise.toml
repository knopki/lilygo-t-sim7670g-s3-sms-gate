[settings]
all_compile = false

[tools]
arduino-cli = "1.5.1"
clang-format = "22.1.8"
"pipx:cppcheck" = "1.5.1"

[tasks."assets"]
description = "Generate gzipped PROGMEM web assets from www/"
run = "python3 tools/gen_assets.py"

[tasks."compile"]
description = "Generate web assets and compile the firmware"
depends = ["assets"]
run = "arduino-cli compile sms_gate"

[tasks."fmt"]
description = "Format Arduino C++ source and headers"
run = "clang-format -i sms_gate/sms_gate.ino sms_gate/config_record.h sms_gate/config_store.h sms_gate/config_store.cpp sms_gate/web_api.h sms_gate/web_api.cpp"

[tasks."fmt:check"]
description = "Check Arduino C++ formatting without modifying"
run = "clang-format --dry-run --Werror sms_gate/sms_gate.ino sms_gate/config_record.h sms_gate/config_store.h sms_gate/config_store.cpp sms_gate/web_api.h sms_gate/web_api.cpp"

[tasks."lint"]
description = "Run Cppcheck on Arduino C++ source"
run = "cppcheck --language=c++ --std=c++20 --check-level=exhaustive --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unknownMacro:sms_gate/web_assets.h sms_gate/sms_gate.ino sms_gate/config_store.cpp sms_gate/web_api.cpp"
